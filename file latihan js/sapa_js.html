<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f2f2f2;
        }

        .box{
            width: 300px;
            margin: 100px auto;
            padding: 20px;
            background-color: white;
            border-radius: 8px;
            text-align: center;
        }

        .box:hover{
            box-shadow: 3px 5px 15px rgba(0, 0, 0, 0.705);
        }

        input{
            width: 90%;
            padding: 8px;
            margin-bottom: 10px;
        }

        button{
            padding: 8px 15px;
            background-color: blue;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        #hasil{
            margin-top: 15px;
            font-weight: bold;
            color: blue;
        }
    </style>
</head>
<body>
    <div class="box">
        <h3>form sapaan</h3>
        <input type="text" name="" id="nama" placeholder="masukan nama">
        <br>
        <br>
        <button onclick="sapa()">sapa</button>
        <p id="hasil"></p>
    </div>

    <script>
        function sapa() {
            let nama = document.getElementById("nama").value;
            document.getElementById("hasil").innerHTML = 
            "hallo, " + nama + " selamat belajar JavaScript";
        }
    </script>
</body>
</html>
