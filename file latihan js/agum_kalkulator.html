<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font-family: arial, helvetica, sans-serif;
            background-color: #f4f4f4;
        }

        h3 {
            text-align: center;
        }

        input {
            margin-bottom: 10px;
            width: auto;
            height: 20px;
            text-align: center;
        }

        button {
            width: 30px;
            height: 30px;
            margin: 5px;
        }

        h4 {
            text-align: center;
        }

        .calculator {
            width: 300px;
            margin: auto;
            background-color: white;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            text-align: center;
            margin-top: 125px;
        }
    </style>
</head>

<body>
    <div class="calculator">
        <h3>kalkulator</h3>
        <input type="number" name="" id="angka1">
        <br>
        <br>
        <input type="number" name="" id="angka2">
        <br>
        <br>
        <button id="tambah" onclick="hitung('+')">+</button>
        <button id="kurang" onclick="hitung('-')">-</button>
        <button id="kali" onclick="hitung('*')">*</button>
        <button id="bagi" onclick="hitung('/')">/</button>
        <h4>Hasil: <span id=hasil>0</span></h4>
    </div>

    <script>
        function hitung(operasi) {
            var angka1 = parseFloat(document.getElementById("angka1").value);
            var angka2 = parseFloat(document.getElementById("angka2").value);
            var hasil = 0;

            if (operasi === '+') {
                hasil = angka1 + angka2;
            } else if (operasi === '-') {
                hasil = angka1 - angka2;
            } else if (operasi === '*') {
                hasil = angka1 * angka2;
            } else if (operasi === '/') {
                hasil = angka1 / angka2;
            }

            document.getElementById("hasil").innerText = hasil;
        }


        









    </script>




</body>

</html>
