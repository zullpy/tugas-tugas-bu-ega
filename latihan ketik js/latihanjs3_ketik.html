<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>latihan js 3 ketik</title>
</head>
<body>
    <p id="awal">teks awal</p>
    <button onclick="berubah()">ubah teks ini</button>

    <script>
        function berubah(){
            document.getElementById("awal").innerHTML = "teks yang sudah diubah";
        }
    </script>

</body>
</html>
